ServerName localhost

<Directory /var/www/html/public>
    AllowOverride None
    Options FollowSymLinks
    Require all granted

    # Preserve bearer credentials when Apache internally routes API requests
    # through Laravel's front controller. Sanctum reads this server variable.
    RewriteEngine On
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    FallbackResource /index.php
</Directory>

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
